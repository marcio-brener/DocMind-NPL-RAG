version: "3.9"

services:

  # ── RabbitMQ Broker ──────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: docmind-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol (pika / consumers)
      - "15672:15672"  # Management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=document_processing_queue
      - RABBITMQ_EXCHANGE=document_exchange
      - RABBITMQ_ROUTING_KEY=document.process
      - CHROMADB_PATH=/app/data/chromadb
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning

  # ── Document Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=document_processing_queue
      - RABBITMQ_EXCHANGE=document_exchange
      - RABBITMQ_ROUTING_KEY=document.process
      - CHROMADB_PATH=/app/data/chromadb
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m workers.document_worker

volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
